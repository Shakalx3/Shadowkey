name: Audit S60 FP1 imports against EKA2 proxies

on:
  push:
    branches: [main]
    paths:
      - ".github/s60-import-audit.trigger"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  import-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Download and unpack both SDK distributions
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p modern old reports
          curl -fL --retry 3 "https://github.com/hpnkv/symbian-platform/releases/download/v0.3.0/symbian-sdk-0.3.0-linux-x86_64.tar.gz" -o modern-sdk.tar.gz
          echo "9be830884a5fd1b9315ea1c11571810f7a50fa673851fa392bb397c6759fec3d  modern-sdk.tar.gz" | sha256sum -c -
          tar -xzf modern-sdk.tar.gz -C modern
          gh release download s60-sdk-3.1-fp1-20261108 --repo "$GITHUB_REPOSITORY" --pattern s60-sdk-devkit-core.tar.gz --dir old
          tar -xzf old/s60-sdk-devkit-core.tar.gz -C old
          test -d modern/proxies
          test -d old/Epoc32/release/armv5/lib

      - name: Capture export and ordinal evidence
        shell: bash
        run: |
          set -euo pipefail
          for lib in euser gdi ws32 cone eikcore bitgdi; do
            echo "===== $lib =====" | tee -a reports/import-audit.txt
            old_dso="old/Epoc32/release/armv5/lib/$lib.dso"
            new_dso="modern/proxies/$lib/$lib.dso"
            if [ -f "$old_dso" ]; then
              echo "--- S60 3.1 FP1 ARMv5 DSO ---" | tee -a reports/import-audit.txt
              file "$old_dso" | tee -a reports/import-audit.txt
              readelf -h "$old_dso" | grep -E 'Class:|Data:|Machine:|Type:|Flags:' | tee -a reports/import-audit.txt
              readelf -Ws "$old_dso" > "reports/s60-$lib-symbols.txt"
              sed -n '1,100p' "reports/s60-$lib-symbols.txt" >> reports/import-audit.txt
            else
              echo "S60 DSO MISSING: $old_dso" | tee -a reports/import-audit.txt
            fi
            if [ -f "$new_dso" ]; then
              echo "--- hpnkv EKA2 import proxy ---" | tee -a reports/import-audit.txt
              file "$new_dso" | tee -a reports/import-audit.txt
              readelf -h "$new_dso" | grep -E 'Class:|Data:|Machine:|Type:|Flags:' | tee -a reports/import-audit.txt
              readelf -Ws "$new_dso" > "reports/modern-$lib-symbols.txt"
              sed -n '1,100p' "reports/modern-$lib-symbols.txt" >> reports/import-audit.txt
            else
              echo "MODERN PROXY MISSING: $new_dso" | tee -a reports/import-audit.txt
            fi
          done
          echo "===== relevant SDK files =====" >> reports/import-audit.txt
          find old/Epoc32/release/armv5/lib -maxdepth 1 -type f \
            \( -iname 'euser.*' -o -iname 'gdi.*' -o -iname 'ws32.*' -o -iname 'cone.*' -o -iname 'eikcore.*' -o -iname 'bitgdi.*' \) \
            -printf '%f %s bytes\\n' | sort >> reports/import-audit.txt
          cat reports/import-audit.txt
          python3 - <<'PY'
          import json, re
          from pathlib import Path

          def symbols(path):
              result = {}
              for line in Path(path).read_text(errors="replace").splitlines():
                  m = re.match(r"\s*\d+:\s+([0-9a-fA-F]+)\s+\d+\s+\S+\s+GLOBAL\s+DEFAULT\s+(\S+)\s+(.+)$", line)
                  if not m or m.group(2) == "UND":
                      continue
                  value = int(m.group(1), 16)
                  raw = m.group(3).strip()
                  name = raw.split("@@", 1)[0].split("@", 1)[0]
                  if not name or value % 4:
                      continue
                  result[name] = value // 4 + 1
              return result

          report = {}
          for lib in ("euser", "gdi", "ws32", "cone", "eikcore", "bitgdi"):
              old_path = Path(f"reports/s60-{lib}-symbols.txt")
              new_path = Path(f"reports/modern-{lib}-symbols.txt")
              if not old_path.exists() or not new_path.exists():
                  report[lib] = {"status": "missing DSO"}
                  continue
              old, new = symbols(old_path), symbols(new_path)
              common = sorted(set(old) & set(new))
              mismatches = [
                  {"symbol": name, "s60_ordinal": old[name], "modern_ordinal": new[name]}
                  for name in common if old[name] != new[name]
              ]
              old_by_ord = {v: k for k, v in old.items()}
              new_by_ord = {v: k for k, v in new.items()}
              conflicts = [
                  {"ordinal": ordinal, "s60_symbol": old_by_ord[ordinal], "modern_symbol": new_by_ord[ordinal]}
                  for ordinal in sorted(set(old_by_ord) & set(new_by_ord))
                  if old_by_ord[ordinal] != new_by_ord[ordinal]
              ]
              report[lib] = {
                  "s60_export_symbols": len(old),
                  "modern_proxy_symbols": len(new),
                  "common_symbols": len(common),
                  "same_ordinal": len(common) - len(mismatches),
                  "ordinal_mismatches": mismatches[:100],
                  "same_ordinal_name_conflicts": conflicts[:100],
              }
          Path("reports/ordinal-comparison.json").write_text(
              json.dumps(report, indent=2, sort_keys=True) + "\\n",
              encoding="utf-8",
          )
          print("===== ordinal comparison =====")
          for lib, row in report.items():
              print(lib, json.dumps({k:v for k,v in row.items() if k not in ("ordinal_mismatches","same_ordinal_name_conflicts")}))
              if row.get("ordinal_mismatches"):
                  print("  ordinal mismatches:", row["ordinal_mismatches"][:8])
              if row.get("same_ordinal_name_conflicts"):
                  print("  same-ordinal conflicts:", row["same_ordinal_name_conflicts"][:8])
          PY

      - name: Upload ordinal audit evidence
        uses: actions/upload-artifact@v4
        with:
          name: s60-fp1-vs-eka2-import-audit
          path: reports/**
          if-no-files-found: error
          retention-days: 90
