name: EUSER1407 static callsite audit
on:
  push:
    branches: [main]
    paths:
      - ".github/euser1407-audit.trigger"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run static callsite audit
        run: python3 tools/euser1407_callsite_audit.py
      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/STEP39_EUSER1407_STATIC_CALLSITE_AUDIT.md
          git commit -m "Add EUSER1407 static callsite audit"
          git push origin HEAD:main
