name: Extract and inventory Nokia firmware

on:
  push:
    paths:
      - ".github/workflows/extract-nokia-firmware.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Install extraction tools
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full unrar-free cabextract innoextract
      - name: Download original release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p firmware-input/ngage firmware-input/n95
          curl -fL --retry 3 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/octet-stream" \
            "https://api.github.com/repos/Shakalx3/Shadowkey/releases/assets/727070110" \
            -o firmware-input/ngage/RH-029.v.04.10.N-GAGE.QD.rar
          curl -fL --retry 3 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/octet-stream" \
            "https://api.github.com/repos/Shakalx3/Shadowkey/releases/assets/727054519" \
            -o firmware-input/n95/RM-320.v.35.00.N-95.exe
          sha256sum firmware-input/ngage/* firmware-input/n95/* | tee firmware-input/SHA256SUMS.txt
          stat -c '%n %s bytes' firmware-input/ngage/* firmware-input/n95/* | tee firmware-input/SIZES.txt
      - name: Inspect and extract N-Gage QD archive
        run: |
          set -euo pipefail
          7z l firmware-input/ngage/RH-029.v.04.10.N-GAGE.QD.rar > firmware-input/ngage-list.txt
          7z x firmware-input/ngage/RH-029.v.04.10.N-GAGE.QD.rar -ofirmware-extracted/ngage -y > firmware-input/ngage-extract.log
      - name: Inspect N95 installer formats
        run: |
          set +e
          7z l firmware-input/n95/RM-320.v.35.00.N-95.exe > firmware-input/n95-7z-list.txt 2>&1
          innoextract --list firmware-input/n95/RM-320.v.35.00.N-95.exe > firmware-input/n95-inno-list.txt 2>&1
          innoextract -d firmware-extracted/n95-inno firmware-input/n95/RM-320.v.35.00.N-95.exe > firmware-input/n95-inno-extract.log 2>&1
          echo $? > firmware-input/n95-inno-exit-code.txt
          set -e
      - name: Build Nokia BB5 image parser and inspect firmware blocks
        run: |
          set -euo pipefail
          sudo apt-get install -y build-essential git libssl-dev zlib1g-dev
          git clone --depth 1 https://github.com/saur0n/libunixpp.git /tmp/libunixpp
          sudo make -C /tmp/libunixpp install
          git clone --depth 1 https://github.com/saur0n/unpacker.git /tmp/nokia-unpacker
          make -C /tmp/nokia-unpacker LIBRARIES="-L/usr/local/lib64 -lstdc++ -lunix++ -lcrypto -lz"
          mkdir -p firmware-parsed/uda firmware-parsed/ppm firmware-parsed/core
          set +e
          LD_LIBRARY_PATH=/tmp/libunixpp /tmp/nokia-unpacker/unpacker -o firmware-parsed/uda firmware-extracted/n95-inno/app/RM320_31.0.002_025_xxx_U01_uda.fpsx > firmware-input/uda-unpack.log 2>&1
          echo $? > firmware-input/uda-unpack.exit
          LD_LIBRARY_PATH=/tmp/libunixpp /tmp/nokia-unpacker/unpacker -o firmware-parsed/ppm firmware-extracted/n95-inno/app/RM-320_35.0.001_PR.v05 > firmware-input/ppm-unpack.log 2>&1
          echo $? > firmware-input/ppm-unpack.exit
          LD_LIBRARY_PATH=/tmp/libunixpp /tmp/nokia-unpacker/unpacker -o firmware-parsed/core firmware-extracted/n95-inno/app/RM-320_35.0.001_PR.C0R > firmware-input/core-unpack.log 2>&1
          echo $? > firmware-input/core-unpack.exit
          set -e
          find firmware-parsed -type f -printf '%p\t%s bytes\n' | sort > firmware-input/PARSED_FILES.tsv
          echo "Parser exit codes (UDA, PPM, CORE):"
          cat firmware-input/uda-unpack.exit firmware-input/ppm-unpack.exit firmware-input/core-unpack.exit
          echo "Parsed files:"
          cat firmware-input/PARSED_FILES.tsv
      - name: Build firmware inventory and locate Symbian modules
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          roots = [Path("firmware-extracted/ngage"), Path("firmware-extracted/n95-inno")]
          wanted = {"euser.dll","cone.dll","gdi.dll","fbscli.dll","eikcore.dll","avkon.dll","ws32.dll","eikcoctl.dll","appcore.dll","efsrv.dll","euser.dso","cone.dso","gdi.dso"}
          with open("firmware-input/EXTRACTED_INVENTORY.tsv","w") as out, open("firmware-input/TARGET_MODULES.tsv","w") as targets:
              out.write("platform\tbytes\tsha256\tpath\n")
              targets.write("platform\tbytes\tsha256\tpath\n")
              for root in roots:
                  if not root.exists(): continue
                  platform = root.name
                  for p in sorted(x for x in root.rglob("*") if x.is_file()):
                      try:
                          h=hashlib.sha256()
                          with p.open("rb") as f:
                              for b in iter(lambda:f.read(1024*1024),b""): h.update(b)
                          row=f"{platform}\t{p.stat().st_size}\t{h.hexdigest()}\t{p.as_posix()}\n"
                          out.write(row)
                          if p.name.lower() in wanted or p.suffix.lower() in {".rom",".rofs",".fpsx",".uda",".c0r"}:
                              targets.write(row)
                      except Exception as e:
                          out.write(f"{platform}\tERROR\t{e}\t{p.as_posix()}\n")
          PY
          echo "File totals:"
          wc -l firmware-input/EXTRACTED_INVENTORY.tsv firmware-input/TARGET_MODULES.tsv
          echo "N95 extraction result:"
          cat firmware-input/n95-inno-exit-code.txt 2>/dev/null || true
      - name: Upload extraction and inventory artifact
        uses: actions/upload-artifact@v4
        with:
          name: nokia-firmware-extraction-inventory
          path: |
            firmware-input/
            firmware-extracted/
          if-no-files-found: error
          compression-level: 1
          retention-days: 30
