name: Extract and inventory Nokia firmware

on:
  push:
    paths:
      - ".github/workflows/extract-nokia-firmware.yml"
      - "source_bundle/host/legacy_app_host.cpp"
      - "tools/step90_build_eka2_app_host.sh"
      - "tools/step92_validate_sdk_dso_dynsym.py"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install extraction tools
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full unrar-free cabextract innoextract
      - name: Download original release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p firmware-input/ngage firmware-input/n95
          curl -fL --retry 3 -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/octet-stream" "https://api.github.com/repos/Shakalx3/Shadowkey/releases/assets/727070110" -o firmware-input/ngage/RH-029.v.04.10.N-GAGE.QD.rar
          curl -fL --retry 3 -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/octet-stream" "https://api.github.com/repos/Shakalx3/Shadowkey/releases/assets/727054519" -o firmware-input/n95/RM-320.v.35.00.N-95.exe
          sha256sum firmware-input/ngage/* firmware-input/n95/* | tee firmware-input/SHA256SUMS.txt
          stat -c '%n %s bytes' firmware-input/ngage/* firmware-input/n95/* | tee firmware-input/SIZES.txt
      - name: Inspect and extract N-Gage QD archive
        run: |
          set -euo pipefail
          7z l firmware-input/ngage/RH-029.v.04.10.N-GAGE.QD.rar > firmware-input/ngage-list.txt
          7z x firmware-input/ngage/RH-029.v.04.10.N-GAGE.QD.rar -ofirmware-extracted/ngage -y > firmware-input/ngage-extract.log
      - name: Inspect N95 installer formats
        run: |
          set +e
          7z l firmware-input/n95/RM-320.v.35.00.N-95.exe > firmware-input/n95-7z-list.txt 2>&1
          innoextract --list firmware-input/n95/RM-320.v.35.00.N-95.exe > firmware-input/n95-inno-list.txt 2>&1
          innoextract -d firmware-extracted/n95-inno firmware-input/n95/RM-320.v.35.00.N-95.exe > firmware-input/n95-inno-extract.log 2>&1
          echo $? > firmware-input/n95-inno-exit-code.txt
          set -e
      - name: Parse FPSX containers and inspect ROFS
        run: |
          set -euo pipefail
          sudo apt-get install -y build-essential git libssl-dev zlib1g-dev
          git clone --depth 1 https://github.com/saur0n/libunixpp.git /tmp/libunixpp
          sudo mkdir -p /usr/local/lib64
          sudo make -C /tmp/libunixpp install
          git clone --depth 1 https://github.com/saur0n/unpacker.git /tmp/nokia-unpacker
          make -C /tmp/nokia-unpacker LIBRARIES="-L/usr/local/lib64 -lstdc++ -lunix++ -lcrypto -lz"
          mkdir -p firmware-parsed/uda firmware-parsed/ppm firmware-parsed/core firmware-parsed/ppm-rofs firmware-parsed/core-rofs
          set +e
          LD_LIBRARY_PATH=/usr/local/lib64:/tmp/libunixpp /tmp/nokia-unpacker/unpacker -o firmware-parsed/uda firmware-extracted/n95-inno/app/RM320_31.0.002_025_xxx_U01_uda.fpsx > firmware-input/uda-unpack.log 2>&1
          echo $? > firmware-input/uda-unpack.exit
          cp firmware-extracted/n95-inno/app/RM-320_35.0.001_PR.v05 firmware-input/ppm-image.fpsx
          cp firmware-extracted/n95-inno/app/RM-320_35.0.001_PR.C0R firmware-input/core-image.fpsx
          LD_LIBRARY_PATH=/usr/local/lib64 /tmp/nokia-unpacker/unpacker -o firmware-parsed/ppm firmware-input/ppm-image.fpsx > firmware-input/ppm-unpack.log 2>&1
          echo $? > firmware-input/ppm-unpack.exit
          LD_LIBRARY_PATH=/usr/local/lib64 /tmp/nokia-unpacker/unpacker -o firmware-parsed/core firmware-input/core-image.fpsx > firmware-input/core-unpack.log 2>&1
          echo $? > firmware-input/core-unpack.exit
          python3 tools/step76_inspect_sos_partition_headers.py
          echo "Carving SOS+CORE, SOS+ROFS and SOS+ROFX partitions"
          python3 tools/step77_carve_sos_rofs_partitions.py
          echo "Skip the unpaged index prefix; reconstruct pageable ROM pages by absolute page number"
          python3 tools/step79_reconstruct_demand_paged_rom.py
          python3 -m py_compile tools/step79_reconstruct_demand_paged_rom.py
          python3 -m py_compile tools/step78_scan_core_rom_e32.py
          python3 -m py_compile tools/step76_inspect_sos_partition_headers.py tools/step77_carve_sos_rofs_partitions.py
          mkdir -p firmware-parsed/core-rofs firmware-parsed/ppm-rofs
          LD_LIBRARY_PATH=/usr/local/lib64 /tmp/nokia-unpacker/unpacker -o firmware-parsed/core-rofs firmware-parsed/carved/core-sos-rofs.rofs > firmware-input/core-rofs-unpack.log 2>&1
          echo $? > firmware-input/core-rofs-unpack.exit
          LD_LIBRARY_PATH=/usr/local/lib64 /tmp/nokia-unpacker/unpacker -o firmware-parsed/ppm-rofs firmware-parsed/carved/ppm-sos-rofx.rofs > firmware-input/ppm-rofx-unpack.log 2>&1
          echo $? > firmware-input/ppm-rofx-unpack.exit
          python3 tools/step75_scan_rofs_signatures.py firmware-parsed/ppm/rofs.img firmware-parsed/core/rofs.img --out firmware-input/rofs-candidates
          mkdir -p firmware-parsed/rofs-candidate-files
          : > firmware-input/rofs-candidate-unpack.log
          candidate_index=0
          while IFS= read -r candidate; do
            [ -f "$candidate" ] || continue
            candidate_index=$((candidate_index+1))
            outdir="firmware-parsed/rofs-candidate-files/candidate-$candidate_index"
            mkdir -p "$outdir"
            echo "### $candidate" >> firmware-input/rofs-candidate-unpack.log
            LD_LIBRARY_PATH=/usr/local/lib64 /tmp/nokia-unpacker/unpacker -o "$outdir" "$candidate" >> firmware-input/rofs-candidate-unpack.log 2>&1
            echo "exit=$?" >> firmware-input/rofs-candidate-unpack.log
          done < <(find firmware-input/rofs-candidates -type f | grep -E '\.(img|rofs)$' | sort)
          set -e
          python3 - <<'PY'
          from pathlib import Path
          import struct
          out = Path("firmware-input/ROFS_HEADERS.txt")
          with out.open("w") as f:
              for p in [Path("firmware-parsed/ppm/rofs.img"), Path("firmware-parsed/core/rofs.img")]:
                  if not p.exists():
                      continue
                  b = p.read_bytes()[:1100]
                  f.write(f"{p}: size={p.stat().st_size}\n")
                  for off in (0, 1024):
                      if len(b) >= off+16:
                          f.write(f"  offset {off}: magic={b[off:off+4]!r} hex={b[off:off+4].hex()} header={b[off+4:off+16].hex()}\n")
          PY
          find firmware-parsed -type f -printf '%p\t%s bytes\n' | sort > firmware-input/PARSED_FILES.tsv
          {
            echo "FPSX exit codes (UDA, PPM, CORE):"
            cat firmware-input/uda-unpack.exit firmware-input/ppm-unpack.exit firmware-input/core-unpack.exit
            echo "ROFS exit codes:"
            for f in firmware-input/*-rofs-unpack.exit firmware-input/ppm-rofx-unpack.exit; do [ -f "$f" ] && { echo "### $f"; cat "$f"; }; done
            echo "SOS partition carve report:"
            cat firmware-input/STEP77_CARVED_PARTITIONS.txt
            echo "ROFS headers:"
            cat firmware-input/ROFS_HEADERS.txt
            echo "ROFS signature scan:"
            cat firmware-input/ROFS_SIGNATURE_SCAN.tsv
            echo "ROFS candidate parser log:"
            cat firmware-input/rofs-candidate-unpack.log
            echo "ROFS parser logs:"
            for f in firmware-input/*-rofs-unpack.log firmware-input/ppm-rofx-unpack.log; do [ -f "$f" ] && { echo "### $f"; cat "$f"; }; done
            echo "Parsed files:"
            cat firmware-input/PARSED_FILES.tsv
          } > firmware-input/PARSER_SUMMARY.txt
      - name: Download pinned S60 3.1 FP1 devkit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          curl -fL --retry 3 -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/octet-stream" "https://api.github.com/repos/Shakalx3/Shadowkey/releases/assets/723972349" -o /tmp/s60-sdk-devkit-core.tar.gz
          echo "7ed8b62b15f191ca47d2f6ca97ee5ce74cd02ce3e42b74bc7b1f9513d7df87b5  /tmp/s60-sdk-devkit-core.tar.gz" | sha256sum -c -
          mkdir -p /tmp/s60-devkit
          tar -xzf /tmp/s60-sdk-devkit-core.tar.gz -C /tmp/s60-devkit
      - name: Parse bundled SIMKIN and GAMECOMMS DLL imports and validate E32 boundaries
        run: |
          set -euo pipefail
          python3 tools/e32/shadowkey_extract_e32_imports.py "source_bundle/shadowkey_step35_work/game_assets/The_Elder_Scrolls_Travels_Shadowkey/system/apps/6R51/SIMKIN.DLL" -o firmware-input/SIMKIN_DLL_import_thunks.csv > firmware-input/SIMKIN_DLL_import_extract.log 2>&1
          python3 tools/e32/shadowkey_extract_e32_imports.py "source_bundle/shadowkey_step35_work/game_assets/The_Elder_Scrolls_Travels_Shadowkey/system/libs/GAMECOMMS.DLL" -o firmware-input/GAMECOMMS_DLL_import_thunks.csv > firmware-input/GAMECOMMS_DLL_import_extract.log 2>&1
          python3 tools/step83_csv_to_import_dispatch.py --csv firmware-input/GAMECOMMS_DLL_import_thunks.csv --out firmware-input/GAMECOMMS_DLL_import_dispatch.c
          python3 -m py_compile tools/step83_csv_to_import_dispatch.py
          python3 -m py_compile tools/step84_inspect_bundled_private_e32_modules.py
          python3 tools/step84_inspect_bundled_private_e32_modules.py \
            --simkin "source_bundle/shadowkey_step35_work/game_assets/The_Elder_Scrolls_Travels_Shadowkey/system/apps/6R51/SIMKIN.DLL" \
            --gamecomms "source_bundle/shadowkey_step35_work/game_assets/The_Elder_Scrolls_Travels_Shadowkey/system/libs/GAMECOMMS.DLL" \
            --game-dispatch source_bundle/shadowkey_step35_work/shadowkey_import_dispatch.c \
            --out-dir firmware-input
      - name: Inspect original 6R51.APP exports and trace every IAT reference
        run: |
          set -euo pipefail
          python3 -m py_compile tools/step86_inspect_game_e32_header.py
          python3 tools/step86_inspect_game_e32_header.py \
            --game source_bundle/shadowkey_step35_work/6R51.APP \
            --dispatch source_bundle/shadowkey_step35_work/shadowkey_import_dispatch.c \
            --out-dir firmware-input
      - name: Checkout N-Gage ARM UREL import libraries
        uses: actions/checkout@v4
        with:
          repository: ngagesdk/sdk
          ref: main
          path: ngagesdk-sdk
          sparse-checkout: |
            6.1/Series60/Epoc32/Release/armi/urel
          sparse-checkout-cone-mode: false
      - name: Map game, SIMKIN and GAMECOMMS ARM UREL imports
        env:
          SHADOWKEY_ARM_SDK_ROOT: ${{ github.workspace }}/ngagesdk-sdk
        run: |
          set -euo pipefail
          SHADOWKEY_IMPORT_DISPATCH="source_bundle/shadowkey_step35_work/shadowkey_import_dispatch.c" SHADOWKEY_IMPORT_OUT="firmware-input/STEP46_GAME_ARM_IMPORTS.md" python3 tools/step46_arm_importlib_ordinal_map.py
          SHADOWKEY_IMPORT_DISPATCH="source_bundle/shadowkey_step35_work/simkin_import_dispatch.c" SHADOWKEY_IMPORT_OUT="firmware-input/STEP46_SIMKIN_ARM_IMPORTS.md" python3 tools/step46_arm_importlib_ordinal_map.py
          SHADOWKEY_IMPORT_DISPATCH="firmware-input/GAMECOMMS_DLL_import_dispatch.c" SHADOWKEY_IMPORT_OUT="firmware-input/STEP46_GAMECOMMS_ARM_IMPORTS.md" python3 tools/step46_arm_importlib_ordinal_map.py
      - name: Download original GCCE EPOC demangler
        run: |
          set -euo pipefail
          sudo dpkg --add-architecture i386
          sudo apt-get update -qq
          sudo apt-get install -y -qq libc6-i386 lib32stdc++6 lib32gcc-s1 lib32z1
          mkdir -p "$RUNNER_TEMP/step82-gcce"
          curl -fL --retry 3 "https://www.martin.st/symbian/gnu-csl-arm-2005Q1C-arm-none-symbianelf-i686-pc-linux-gnu.tar.bz2" -o "$RUNNER_TEMP/step82-gcce/gcce.tar.bz2"
          test "$(stat -c '%s' "$RUNNER_TEMP/step82-gcce/gcce.tar.bz2")" = "10896869"
          test "$(md5sum "$RUNNER_TEMP/step82-gcce/gcce.tar.bz2" | awk '{print $1}')" = "622e4db70cfae6a9eec26892a9932633"
          mkdir -p "$RUNNER_TEMP/step82-gcce/root"
          tar -xjf "$RUNNER_TEMP/step82-gcce/gcce.tar.bz2" -C "$RUNNER_TEMP/step82-gcce/root"
          DEM=$(find "$RUNNER_TEMP/step82-gcce/root" -type f -name 'arm-none-symbianelf-c++filt' | head -n1)
          test -n "$DEM" && test -x "$DEM"
          BIN=$(dirname "$DEM")
          OBJDUMP=$(find "$RUNNER_TEMP/step82-gcce/root" -type f -name 'arm-none-symbianelf-objdump' | head -n1)
          test -n "$OBJDUMP" && test -x "$OBJDUMP"
          echo "EPOC_DEMANGLER=$DEM" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$BIN/../lib:$BIN/../lib32" >> "$GITHUB_ENV"
          echo "EPOC_OBJDUMP=$OBJDUMP" >> "$GITHUB_ENV"
          "$DEM" < <(printf '%s\n' '__7TPtrC16PCUs' '__ne__C6TInt64RC6TInt64') > firmware-input/STEP81_EPOC_DEMANGLER_CHECK.txt
      - name: Inspect target EikStart and RLibrary declarations
        run: |
          set -euo pipefail
          python3 -m py_compile tools/step89_find_eikstart_factory_api.py
          python3 tools/step89_find_eikstart_factory_api.py \
            --sdk-root /tmp/s60-devkit \
            --out firmware-input/STEP89_EIKSTART_FACTORY_API.txt
      - name: Build EKA2 host with Linux-normalized GCCE headers and public EikStart API
        run: |
          set -euo pipefail
          bash tools/step90_build_eka2_app_host.sh
        continue-on-error: true
      - name: Record EKA2 host build outcome
        if: always()
        run: |
          set -euo pipefail
          out=firmware-input/STEP90_LEGACY_APP_HOST
          if [ -s "$out/6R51Host.exe" ] && [ -s "$out/host-e32-header.json" ]; then
            echo "HOST_E32_BUILD=SUCCESS" | tee "$out/STEP90_BUILD_STATUS.txt"
            cat "$out/host-e32-header.json"
          else
            echo "HOST_E32_BUILD=NOT_BUILT_OR_NOT_VALIDATED" | tee "$out/STEP90_BUILD_STATUS.txt"
            if [ -f "$out/build.log" ]; then tail -n 60 "$out/build.log"; fi
          fi
      - name: Disassemble the legacy APP factory export
        run: |
          set -euo pipefail
          python3 -m py_compile tools/step87_disassemble_legacy_app_factory.py
          python3 tools/step87_disassemble_legacy_app_factory.py \
            --game source_bundle/shadowkey_step35_work/6R51.APP \
            --header firmware-input/STEP86_GAME_E32_HEADER.json \
            --exports firmware-input/STEP86_GAME_EXPORTS.tsv \
            --objdump "$EPOC_OBJDUMP" \
            --out firmware-input/STEP87_GAME_FACTORY_DISASSEMBLY.txt
      - name: Disassemble unmatched legacy APP import thunk
        run: |
          set -euo pipefail
          python3 -m py_compile tools/step88_disassemble_unmatched_iat_slots.py
          python3 tools/step88_disassemble_unmatched_iat_slots.py \
            --game source_bundle/shadowkey_step35_work/6R51.APP \
            --header firmware-input/STEP86_GAME_E32_HEADER.json \
            --iat-refs firmware-input/STEP86_GAME_IAT_REFERENCES.tsv \
            --objdump "$EPOC_OBJDUMP" \
            --out firmware-input/STEP88_UNMATCHED_IAT_DISASSEMBLY.txt
      - name: Symbolize actual N95 ROM exports against target SDK
        run: |
          set -euo pipefail
          mkdir -p firmware-input/s60-sdk
          python3 tools/step58_s60_target_export_map.py --sdk-root /tmp/s60-devkit --output-dir firmware-input/s60-sdk
          python3 -m py_compile tools/step80_compare_n95_rom_sdk_exports.py
          echo "Cross-check all 25 game and GAMECOMMS system DLL dependencies"
          python3 tools/step80_compare_n95_rom_sdk_exports.py --sdk-root /tmp/s60-devkit --rom-dir firmware-input
          cat firmware-input/STEP80_ROM_SDK_EXPORT_CHECK.json
      - name: Independently validate SDK DSO dynsym ordinals
        run: |
          set -euo pipefail
          python3 -m py_compile tools/step92_validate_sdk_dso_dynsym.py
          set +e
          python3 tools/step92_validate_sdk_dso_dynsym.py --sdk-root /tmp/s60-devkit --rom-dir firmware-input > firmware-input/STEP92_DSO_DYNSYM_VALIDATION.log 2>&1
          status=$?
          echo "$status" > firmware-input/STEP92_DSO_DYNSYM_VALIDATION.exit
          cat firmware-input/STEP92_DSO_DYNSYM_VALIDATION.log
          set -e
      - name: Map game, SIMKIN and GAMECOMMS imports to N95 ROM exports and validate cross-DLL aliases
        run: |
          set -euo pipefail
          python3 -m py_compile tools/step82_map_game_imports_to_n95.py
          python3 tools/step82_map_game_imports_to_n95.py \
            --epoc-demangler "$EPOC_DEMANGLER" \
            --target-demangler c++filt \
            --rom-dir firmware-input \
            --game-dispatch source_bundle/shadowkey_step35_work/shadowkey_import_dispatch.c \
            --game-iat-refs firmware-input/STEP86_GAME_IAT_REFERENCES.tsv \
            --simkin-dispatch source_bundle/shadowkey_step35_work/simkin_import_dispatch.c \
            --game-arm-map firmware-input/STEP46_GAME_ARM_IMPORTS.tsv \
            --simkin-arm-map firmware-input/STEP46_SIMKIN_ARM_IMPORTS.tsv \
            --gamecomms-dispatch firmware-input/GAMECOMMS_DLL_import_dispatch.c \
            --gamecomms-arm-map firmware-input/STEP46_GAMECOMMS_ARM_IMPORTS.tsv
          cat firmware-input/STEP82_IMPORT_MAPPING_SUMMARY.json
          python3 - <<'PY'
          import csv
          import json
          from pathlib import Path
          p = Path("firmware-input/STEP82_GAMECOMMS_IMPORT_TARGET_MAP.tsv")
          rows = list(csv.DictReader(p.open(newline="", encoding="utf-8"), delimiter="\t"))
          expected = {
              61: ("bluetooth", 146),
              40: ("bluetooth", 141),
              51: ("bluetooth", 139),
              43: ("bluetooth", 140),
              47: ("bluetooth", 144),
          }
          by_old = {int(r["old_ordinal"]): r for r in rows if r["dll"] == "btmanclient"}
          for old, (dll, ordinal) in expected.items():
              row = by_old.get(old)
              assert row, f"missing btmanclient ordinal {old}"
              assert row["target_dll"] == dll, (old, row)
              assert int(row["target_ordinal"]) == ordinal, (old, row)
              assert row["status"].startswith("CROSS_DLL"), (old, row)
          device = {int(r["old_ordinal"]): r for r in rows if r["dll"] == "btdevice"}
          expected_device = {34: 97, 33: 95, 35: 96}
          for old, ordinal in expected_device.items():
              row = device[old]
              assert row["target_dll"] == "btdevice", (old, row)
              assert int(row["target_ordinal"]) == ordinal, (old, row)
              assert row["status"] == "CONST_MEMBER_ABI_MATCH", (old, row)
          print("PASS: five cross-DLL security APIs and three const-qualified TBTDeviceClass methods remap")
          game_rows = list(csv.DictReader(Path("firmware-input/STEP82_GAME_IMPORT_TARGET_MAP.tsv").open(newline="", encoding="utf-8"), delimiter="\t"))
          by_game = {(r["dll"], int(r["old_ordinal"])): r for r in game_rows}
          key_sounds = by_game[("avkon", 874)]
          assert key_sounds["target_dll"] == "avkon" and int(key_sounds["target_ordinal"]) == 3002
          assert key_sounds["status"] == "CLASS_HIERARCHY_ALIAS"
          fs_close = by_game[("efsrv", 15)]
          assert fs_close["target_dll"] == "euser" and int(fs_close["target_ordinal"]) == 387
          assert fs_close["status"] == "NEEDS_SUBSESSION_CLOSE_WRAPPER"
          print("PASS: AVKON base-class alias and RFsBase subsession-wrapper candidate")
          PY
      - name: Summarize core RM-320 ROM exports and selected import mappings
        run: |
          set -euo pipefail
          python3 -m py_compile tools/step91_summarize_n95_rom_exports.py
          python3 tools/step91_summarize_n95_rom_exports.py
          echo 'Step91 key ordinal cases include EUSER 1407/1575, CONE 160 and GDI 101/108/151.'
      - name: Inspect BTENG ordinal compatibility against N95 ROM
        run: |
          set -euo pipefail
          python3 -m py_compile tools/step85_inspect_bteng_rom_ordinals.py
          python3 tools/step85_inspect_bteng_rom_ordinals.py \
            --sdk-root "$GITHUB_WORKSPACE/ngagesdk-sdk" \
            --rom-dir firmware-input \
            --epoc-demangler "$EPOC_DEMANGLER" \
            --objdump "$EPOC_OBJDUMP"
      - name: Inventory E32 modules and export candidates
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, shutil, struct
          roots = [Path("firmware-extracted/ngage"), Path("firmware-extracted/n95-inno"), Path("firmware-parsed/uda"), Path("firmware-parsed/ppm-rofs"), Path("firmware-parsed/core-rofs"), Path("firmware-parsed/rofs-candidate-files")]
          wanted = {"euser.dll","cone.dll","gdi.dll","fbscli.dll","eikcore.dll","avkon.dll","ws32.dll","eikcoctl.dll","appcore.dll","efsrv.dll"}
          candidates = Path("firmware-input/e32-candidates")
          candidates.mkdir(parents=True, exist_ok=True)
          with open("firmware-input/EXTRACTED_INVENTORY.tsv","w",encoding="utf-8",errors="backslashreplace") as out, open("firmware-input/TARGET_MODULES.tsv","w",encoding="utf-8",errors="backslashreplace") as targets, open("firmware-input/E32_CANDIDATES.tsv","w",encoding="utf-8",errors="backslashreplace") as e32:
              out.write("tree\tbytes\tsha256\tpath\n")
              targets.write("tree\tbytes\tsha256\tpath\n")
              e32.write("tree\tuid1\tuid2\tuid3\te32_version\texport_count\tbytes\tsha256\tpath\tcopied_as\n")
              for root in roots:
                  if not root.exists(): continue
                  for p in sorted(x for x in root.rglob("*") if x.is_file()):
                      try:
                          h=hashlib.sha256()
                          with p.open("rb") as f:
                              for block in iter(lambda:f.read(1024*1024),b""): h.update(block)
                          digest=h.hexdigest()
                          row=f"{root.name}\t{p.stat().st_size}\t{digest}\t{p.as_posix()}\n"
                          out.write(row)
                          if p.name.lower() in wanted or p.suffix.lower() in {".rom",".rofs",".fpsx",".uda",".c0r"}:
                              targets.write(row)
                          with p.open("rb") as f: head=f.read(0x80)
                          if len(head)>=0x40 and head[0x10:0x14]==b"EPOC":
                              uid1,uid2,uid3=struct.unpack_from("<III",head,0)
                              e32ver=struct.unpack_from("<I",head,0x18)[0]
                              exp=struct.unpack_from("<I",head,0x5c)[0]
                              copyname=""
                              if p.name.lower() in wanted:
                                  copyname=f"{digest[:12]}_{p.name}"
                                  shutil.copy2(p,candidates/copyname)
                              e32.write(f"{root.name}\t{uid1:08X}\t{uid2:08X}\t{uid3:08X}\t{e32ver:08X}\t{exp}\t{p.stat().st_size}\t{digest}\t{p.as_posix()}\t{copyname}\n")
                      except Exception as ex:
                          out.write(f"{root.name}\tERROR\t{ex}\t{p.as_posix()}\n")
          print("Inventory complete")
          print(Path("firmware-input/E32_CANDIDATES.tsv").read_text())
          PY
      - name: Remove large intermediate images and source packages
        run: |
          rm -rf firmware-input/rofs-candidates firmware-input/rom-modules firmware-input/e32-candidates
          rm -f firmware-input/rom-unpaged-reconstructed.bin firmware-input/rom-reconstructed.bin
          rm -f firmware-input/ngage/*.rar firmware-input/n95/*.exe firmware-input/*.fpsx firmware-input/*.rofs
          rm -rf firmware-parsed firmware-extracted
          echo "Largest remaining diagnostic files:"
          find firmware-input -type f -printf '%s\t%p\n' | sort -nr | head -n 30
          echo "Unexpected raw system/firmware binaries (must be empty):"
          raw_files=$(find firmware-input -type f \( -iname '*.dll' -o -iname '*.c0r' -o -iname '*.fpsx' -o -iname '*.rofs' -o -iname '*.img' -o -iname '*.bin' \) -print)
          if [ -n "$raw_files" ]; then printf '%s\n' "$raw_files"; exit 1; fi
      - name: Upload compact diagnostic artifact
        uses: actions/upload-artifact@v4
        with:
          name: nokia-firmware-rofs-diagnostics
          path: firmware-input/
          if-no-files-found: error
          compression-level: 6
          retention-days: 30
