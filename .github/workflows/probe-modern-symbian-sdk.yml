name: Validate modern EKA2 ARMv6 toolchain

on:
  push:
    branches: [main]
    paths:
      - ".github/symbian-sdk-probe.trigger"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-sdk:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Download and verify hpnkv Symbian SDK 0.3.0
        shell: bash
        run: |
          set -euo pipefail
          URL="https://github.com/hpnkv/symbian-platform/releases/download/v0.3.0/symbian-sdk-0.3.0-linux-x86_64.tar.gz"
          curl -fL --retry 3 "$URL" -o symbian-sdk.tar.gz
          echo "9be830884a5fd1b9315ea1c11571810f7a50fa673851fa392bb397c6759fec3d  symbian-sdk.tar.gz" | sha256sum -c -
          mkdir sdk
          tar -xzf symbian-sdk.tar.gz -C sdk
          echo "glibc: $(ldd --version | head -1)"
          echo "SDK top-level:"
          find sdk -maxdepth 2 -type f | sort | head -100
          test -x sdk/bin/cmake
          test -x sdk/bin/ninja
          test -x sdk/bin/symbian-native

      - name: Build official ARMv6 EKA2 GUI example
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports
          {
            echo "=== SDK native tools ==="
            sdk/bin/cmake --version
            sdk/bin/ninja --version
            sdk/bin/symbian-native --help || true
            echo "=== Configure hello_time ==="
            sdk/bin/cmake -S sdk/examples/hello_time -B build/hello_time -G Ninja \
              -DCMAKE_TOOLCHAIN_FILE="$PWD/sdk/cmake/symbian-arm.cmake" \
              -DSYMBIAN_SDK_PREFIX="$PWD/sdk" \
              -DCMAKE_MAKE_PROGRAM="$PWD/sdk/bin/ninja"
            echo "=== Build hello_time ==="
            sdk/bin/cmake --build build/hello_time --verbose
            echo "=== ELF ==="
            file build/hello_time/hello_time.elf
            readelf -h build/hello_time/hello_time.elf
            echo "=== E32 output ==="
            find build/hello_time/e32 -maxdepth 1 -type f -printf '%f %s bytes\\n'
            file build/hello_time/e32/hello_time.exe
            xxd -l 128 build/hello_time/e32/hello_time.exe
            echo "=== E32 native inspection ==="
            python3 -m pip install --disable-pip-version-check symbian-platform==0.3.0
            python3 - <<'PY'
          import json
          from pathlib import Path
          from symbian.e32.images import inspect_image
          path = Path("build/hello_time/e32/hello_time.exe")
          info = inspect_image(path)
          print(json.dumps(info, indent=2, sort_keys=True))
          Path("reports/hello_time_e32_inspection.json").write_text(
              json.dumps(info, indent=2, sort_keys=True) + "\\n",
              encoding="utf-8",
          )
          assert info["kernel"] == "eka2", info["kernel"]
          assert info["architecture"] == "armv6", info["architecture"]
          assert info["uid3"] == 0xE0000830, hex(info["uid3"])
          assert info["code_size"] > 0, info["code_size"]
          assert info["code_base"] == 0x8000, hex(info["code_base"])
          assert info["entry_offset"] == 0, info["entry_offset"]
          assert info["imports"], "E32 image has no imported DLL blocks"
          summary = {
              "kernel": info["kernel"],
              "architecture": info["architecture"],
              "uid3": hex(info["uid3"]),
              "code_base": hex(info["code_base"]),
              "code_size": info["code_size"],
              "entry_offset": info["entry_offset"],
              "capabilities": info["capabilities"],
              "import_dlls": sorted(block["dll"] for block in info["imports"]),
              "import_slots": sum(len(block["slots"]) for block in info["imports"]),
              "exports": info["exports"],
          }
          Path("reports/hello_time_e32_summary.json").write_text(
              json.dumps(summary, indent=2, sort_keys=True) + "\\n",
              encoding="utf-8",
          )
          print("E32 assertions: PASS")
          print(json.dumps(summary, indent=2, sort_keys=True))
          PY
          } 2>&1 | tee reports/armv6-eka2-build.log

      - name: Publish native E32 proof and logs
        uses: actions/upload-artifact@v4
        with:
          name: symbian-platform-0.3.0-armv6-eka2-proof
          path: |
            reports/**
            build/hello_time/hello_time.elf
            build/hello_time/e32/hello_time.exe
          if-no-files-found: error
          retention-days: 90
