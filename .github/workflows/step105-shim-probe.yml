name: Step105 visible TInt64 shim ABI probe

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/step105-shim-probe.yml"
      - "source_bundle/host/step105/**"
      - "source_bundle/host/step102/ShadowkeyAbiProbe_reg.rss"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-modern:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      e32_tag: ${{ steps.publish.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Download modern EKA2 toolchain and S60 3.1 FP1 import SDK
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p downloads modern
          gh release download v0.3.0 --repo hpnkv/symbian-platform \
            --pattern symbian-sdk-0.3.0-linux-x86_64.tar.gz --dir downloads
          tar -xzf downloads/symbian-sdk-0.3.0-linux-x86_64.tar.gz -C modern
          toolchain_file=$(find modern -path '*/cmake/symbian-arm.cmake' -print -quit)
          test -n "$toolchain_file"
          toolchain_file=$(realpath "$toolchain_file")
          modern_root=$(dirname "$(dirname "$toolchain_file")")
          for proxy in euser/euser.dso estlib-legacy/estlib.dso drtaeabi/drtaeabi.dso; do
            test -s "$modern_root/proxies/$proxy" || {
              echo "Required Legacy EKA2 ordinal proxy missing: $modern_root/proxies/$proxy"
              exit 1
            }
          done
          echo "MODERN_ROOT=$modern_root" >> "$GITHUB_ENV"
          echo "TOOLCHAIN_FILE=$toolchain_file" >> "$GITHUB_ENV"

      - name: Build visible probe EXE and compatibility DLL
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ninja-build
          cmake -S source_bundle/host/step105 -B build/step105 -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$TOOLCHAIN_FILE" \
            -DSYMBIAN_SDK_PREFIX="$MODERN_ROOT" \
            -DSYMBIAN_TARGET_ARCH=armv5t \
            -DSYMBIAN_RUNTIME_LEGACY_EKA2=ON \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build/step105 --target ShadowkeyShimProbe_e32 ShadowkeyCompat105 --parallel 2
          exe=$(find build/step105 -type f -name ShadowkeyShimProbe.exe -print -quit)
          dll=$(find build/step105 -type f -name ShadowkeyCompat105.dll -print -quit)
          test -s "$exe"
          test -s "$dll"
          mkdir -p stage
          cp "$exe" stage/ShadowkeyShimProbe.exe
          cp "$dll" stage/ShadowkeyCompat105.dll
          python3 - <<'PY'
          import json, struct
          from pathlib import Path
          def inspect(path, expected):
              data = Path(path).read_bytes()
              if len(data) < 0x7c or data[0x10:0x14] != b"EPOC":
                  raise SystemExit(f"{path}: not a valid E32 image")
              u = lambda off: struct.unpack_from("<I", data, off)[0]
              header = {"file": path, "size": len(data), "uid1": f"0x{u(0):08X}",
                        "uid2": f"0x{u(4):08X}", "uid3": f"0x{u(8):08X}",
                        "code_size": u(0x30), "dll_ref_count": u(0x54),
                        "export_count": u(0x5c)}
              for key, value in expected.items():
                  if header[key] != value:
                      raise SystemExit(f"{path}: {key}={header[key]}, expected {value}")
              print(json.dumps(header, indent=2))
          inspect("stage/ShadowkeyShimProbe.exe", {
              "uid1": "0x1000007A", "uid2": "0x00000000", "uid3": "0xE000BEF1"})
          inspect("stage/ShadowkeyCompat105.dll", {
              "uid1": "0x10000079", "uid2": "0x1000008D",
              "uid3": "0xE000BEEF", "export_count": 1})
          PY

      - name: Publish intermediate E32 images
        id: publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="shadowkey-step105-e32-$GITHUB_RUN_ID"
          gh release create "$tag" stage/ShadowkeyShimProbe.exe stage/ShadowkeyCompat105.dll \
            --repo "$GITHUB_REPOSITORY" \
            --title "Shadowkey Step105 TInt64 shim probe E32 images" \
            --notes "Visible EKA2 Window Server probe that loads ShadowkeyCompat ordinal 1 and tests 64-bit inequality. Not the game port."
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  package-sis:
    runs-on: windows-latest
    needs: build-modern
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Download E32 images and S60 3.1 FP1 SIS tools
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          E32_TAG: ${{ needs.build-modern.outputs.e32_tag }}
        run: |
          New-Item -ItemType Directory -Force stage,sdk | Out-Null
          gh release download $env:E32_TAG --repo $env:GITHUB_REPOSITORY --pattern ShadowkeyShimProbe.exe --pattern ShadowkeyCompat105.dll --dir stage
          gh release download s60-sdk-3.1-fp1-20261108 --repo $env:GITHUB_REPOSITORY --pattern s60-sdk-devkit-core.tar.gz --dir sdk
          tar -xzf sdk/s60-sdk-devkit-core.tar.gz -C sdk
          $sdkRoot = Join-Path (Get-Location) "sdk"
          $makesis = Get-ChildItem $sdkRoot -Recurse -File -Filter makesis.exe | Select-Object -First 1
          $epocrc = Get-ChildItem $sdkRoot -Recurse -File -Filter epocrc.bat | Select-Object -First 1
          $epocrcScript = Get-ChildItem $sdkRoot -Recurse -File -Filter epocrc.pl | Select-Object -First 1
          if (!$makesis -or !$epocrc -or !$epocrcScript) { throw "Required S60 SDK tools missing" }
          "MAKESIS=$($makesis.FullName)" >> $env:GITHUB_ENV
          "EPOCRC=$($epocrc.FullName)" >> $env:GITHUB_ENV
          "EPOCRC_DIR=$($epocrcScript.DirectoryName)" >> $env:GITHUB_ENV
          "EPOCROOT=$($sdkRoot.TrimEnd('\') + '\')" >> $env:GITHUB_ENV

      - name: Compile application registration resource
        shell: pwsh
        run: |
          $out = Join-Path (Get-Location) "stage"
          $rss = Join-Path (Get-Location) "source_bundle/host/step105/ShadowkeyShimProbe_reg.rss"
          $include = Join-Path (Get-Location) "sdk/Epoc32/include"
          $env:PATH = "$env:EPOCRC_DIR;$env:PATH"
          Push-Location $out
          try {
            & $env:EPOCRC -v -u "-I$include" "-t$out" $rss "-oShadowkeyShimProbe_reg.rsc" "-hShadowkeyShimProbe_reg.rsg" 2>&1 | Tee-Object -FilePath epocrc.log
            if ($LASTEXITCODE -ne 0) { throw "epocrc failed with exit code $LASTEXITCODE" }
          } finally { Pop-Location }
          if (!(Test-Path stage/ShadowkeyShimProbe_reg.rsc)) { throw "Registration RSC missing" }

      - name: Create S60 3rd Edition FP1 SIS
        shell: pwsh
        run: |
          @(
            '#{"Shadowkey TInt64 Shim Probe"},(0xE000BEF2),1,0,0,TYPE=SA'
            '[0x102032BE], 0, 0, 0, {"S60 3rd Edition FP1"}'
            '%{"OpenAI"}'
            ':"OpenAI"'
            '"stage/ShadowkeyShimProbe.exe" - "!:\sys\bin\ShadowkeyShimProbe.exe"'
            '"stage/ShadowkeyCompat105.dll" - "!:\sys\bin\ShadowkeyCompat105.dll"'
            '"stage/ShadowkeyShimProbe_reg.rsc" - "!:\private\10003a3f\import\apps\ShadowkeyShimProbe_reg.rsc"'
          ) | Set-Content stage/ShadowkeyShimProbe.pkg -Encoding ascii
          & $env:MAKESIS -v stage/ShadowkeyShimProbe.pkg stage/ShadowkeyShimProbe.sis
          if ($LASTEXITCODE -ne 0) { throw "makesis failed" }
          if (!(Test-Path stage/ShadowkeyShimProbe.sis)) { throw "SIS was not generated" }
          $hash = (Get-FileHash stage/ShadowkeyShimProbe.sis -Algorithm SHA256).Hash
          "SIS SHA256: $hash"

      - name: Publish SIS package
        if: success()
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "shadowkey-step105-sis-$env:GITHUB_RUN_ID"
          $hash = (Get-FileHash stage/ShadowkeyShimProbe.sis -Algorithm SHA256).Hash
          gh release create $tag stage/ShadowkeyShimProbe.sis --repo $env:GITHUB_REPOSITORY --title "Shadowkey Step105 visible TInt64 shim ABI probe" --notes "Green field + white cross means ShadowkeyCompat loaded, ordinal 1 resolved, and equal/low-word/high-word TInt64 comparison tests passed. Amber means DLL load failed; red means ordinal lookup or compare failed. Not the game port. SHA256: $hash"
          if ($LASTEXITCODE -ne 0) { throw "GitHub release publication failed" }
