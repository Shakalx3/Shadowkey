name: Step142 inline compatibility shim probe
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/step142-inline-shim.yml"
      - "source_bundle/host/step142/**"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      e32_tag: ${{ steps.publish.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Download modern EKA2 toolchain
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p downloads modern
          gh release download v0.3.0 --repo hpnkv/symbian-platform --pattern symbian-sdk-0.3.0-linux-x86_64.tar.gz --dir downloads
          tar -xzf downloads/symbian-sdk-0.3.0-linux-x86_64.tar.gz -C modern
          toolchain_file=$(find modern -path '*/cmake/symbian-arm.cmake' -print -quit)
          test -n "$toolchain_file"
          toolchain_file=$(realpath "$toolchain_file")
          modern_root=$(dirname "$(dirname "$toolchain_file")")
          echo "MODERN_ROOT=$modern_root" >> "$GITHUB_ENV"
          echo "TOOLCHAIN_FILE=$toolchain_file" >> "$GITHUB_ENV"
      - name: Build inline-shim probe
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ninja-build
          cmake -S source_bundle/host/step142 -B build/step142 -G Ninja -DCMAKE_TOOLCHAIN_FILE="$TOOLCHAIN_FILE" -DSYMBIAN_SDK_PREFIX="$MODERN_ROOT" -DSYMBIAN_TARGET_ARCH=armv5t -DSYMBIAN_RUNTIME_LEGACY_EKA2=ON -DCMAKE_BUILD_TYPE=Release
          cmake --build build/step142 --parallel 2
          exe=$(find build/step142 -type f -name ShadowkeyInlineShimProbe.exe -print -quit)
          test -s "$exe"
          mkdir -p stage
          cp "$exe" stage/ShadowkeyInlineShimProbe.exe
      - name: Publish E32 executable
        id: publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="shadowkey-step142-e32-$GITHUB_RUN_ID"
          gh release create "$tag" stage/ShadowkeyInlineShimProbe.exe --repo "$GITHUB_REPOSITORY" --title "Shadowkey Step142 inline shim E32" --notes "EKA2 EXE with TInt64 compatibility routine linked into the executable; no DLL payload."
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
  package-sis:
    runs-on: windows-latest
    needs: build
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Download executable and S60 SDK
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          E32_TAG: ${{ needs.build.outputs.e32_tag }}
        run: |
          New-Item -ItemType Directory -Force stage,sdk | Out-Null
          gh release download $env:E32_TAG --repo $env:GITHUB_REPOSITORY --pattern ShadowkeyInlineShimProbe.exe --dir stage
          gh release download s60-sdk-3.1-fp1-20261108 --repo $env:GITHUB_REPOSITORY --pattern s60-sdk-devkit-core.tar.gz --dir sdk
          tar -xzf sdk/s60-sdk-devkit-core.tar.gz -C sdk
          $sdkRoot = Join-Path (Get-Location) "sdk"
          $makesis = Get-ChildItem $sdkRoot -Recurse -File -Filter makesis.exe | Select-Object -First 1
          $epocrc = Get-ChildItem $sdkRoot -Recurse -File -Filter epocrc.bat | Select-Object -First 1
          $epocrcScript = Get-ChildItem $sdkRoot -Recurse -File -Filter epocrc.pl | Select-Object -First 1
          if (!$makesis -or !$epocrc -or !$epocrcScript) { throw "Required S60 SDK tools missing" }
          "MAKESIS=$($makesis.FullName)" >> $env:GITHUB_ENV
          "EPOCRC=$($epocrc.FullName)" >> $env:GITHUB_ENV
          "EPOCRC_DIR=$($epocrcScript.DirectoryName)" >> $env:GITHUB_ENV
      - name: Compile registration resource
        shell: pwsh
        run: |
          $out = Join-Path (Get-Location) "stage"
          $rss = Join-Path (Get-Location) "source_bundle/host/step142/ShadowkeyInlineShimProbe_reg.rss"
          $include = Join-Path (Get-Location) "sdk/Epoc32/include"
          $env:PATH = "$env:EPOCRC_DIR;$env:PATH"
          Push-Location $out
          try {
            & $env:EPOCRC -v -u "-I$include" "-t$out" $rss "-oShadowkeyInlineShimProbe_reg.rsc" "-hShadowkeyInlineShimProbe_reg.rsg" 2>&1 | Tee-Object -FilePath epocrc.log
            if ($LASTEXITCODE -ne 0) { throw "epocrc failed with exit code $LASTEXITCODE" }
          } finally { Pop-Location }
          if (!(Test-Path stage/ShadowkeyInlineShimProbe_reg.rsc)) { throw "Registration RSC missing" }
      - name: Create SIS without a separate DLL
        shell: pwsh
        run: |
          @(
            '#{"Shadowkey Inline Shim Probe"},(0xE000BEFB),1,0,0,TYPE=SA'
            '[0x102032BE], 0, 0, 0, {"S60 3rd Edition FP1"}'
            '%{"Shadowkey"}'
            ':"Shadowkey"'
            '"stage/ShadowkeyInlineShimProbe.exe" - "!:\sys\bin\ShadowkeyInlineShimProbe.exe"'
            '"stage/ShadowkeyInlineShimProbe_reg.rsc" - "!:\private\10003a3f\import\apps\ShadowkeyInlineShimProbe_reg.rsc"'
          ) | Set-Content stage/ShadowkeyInlineShimProbe.pkg -Encoding ascii
          & $env:MAKESIS -v stage/ShadowkeyInlineShimProbe.pkg stage/ShadowkeyInlineShimProbe_Step142.sis
          if ($LASTEXITCODE -ne 0) { throw "makesis failed" }
          if (!(Test-Path stage/ShadowkeyInlineShimProbe_Step142.sis)) { throw "SIS was not generated" }
          $hash = (Get-FileHash stage/ShadowkeyInlineShimProbe_Step142.sis -Algorithm SHA256).Hash
          "SIS SHA256: $hash"
          "SIS size: $((Get-Item stage/ShadowkeyInlineShimProbe_Step142.sis).Length)"
      - name: Publish SIS
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "shadowkey-step142-sis-$env:GITHUB_RUN_ID"
          $hash = (Get-FileHash stage/ShadowkeyInlineShimProbe_Step142.sis -Algorithm SHA256).Hash
          gh release create $tag stage/ShadowkeyInlineShimProbe_Step142.sis --repo $env:GITHUB_REPOSITORY --title "Shadowkey Step142 inline shim SIS" --notes "SIS contains one EKA2 EXE with the TInt64 shim linked in; no separate DLL. SHA256: $hash"
          if ($LASTEXITCODE -ne 0) { throw "GitHub release publication failed" }
