name: Step143 source-object provenance trace

on:
  push:
    branches: [main]
    paths:
      - "source_bundle/shadowkey_step35_work/shadowkey_engine_init_live_test.c"
      - "source_bundle/shadowkey_step35_work/shadowkey_hle_vfs_trace.c"
      - ".github/workflows/step143-source-pointer-provenance.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  provenance:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install host compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y clang
      - name: Build and run existing regressions
        working-directory: source_bundle/shadowkey_step35_work
        run: |
          set -euo pipefail
          bash build_and_test.sh
      - name: Run natural high-RAM VFS path with provenance watches
        working-directory: source_bundle/shadowkey_step35_work
        env:
          SHADOWKEY_HLE_FREE_RAM_BYTES: "33554432"
          SHADOWKEY_DIAGNOSTIC_CONTINUE_UNIMPLEMENTED: "1"
        run: |
          set -euo pipefail
          set +e
          bash trace_asset_loader_live_vfs.sh
          rc=$?
          set -e
          echo "Live trace exit code: $rc (diagnostic continuation enabled; not a full-initialization result)"
          if [ -f .build/live_hal_vfs_trace.log ]; then
            echo "=== Step143 source-pointer provenance ==="
            grep -E "STEP143|DIAGNOSTIC NO-OP|sub_100298a4|sub_1001f9ac|FIELD WRITE|SOURCE POINTER STORE|HLE EUSER1283|HLE EUSER1431|HLE EUSER85|HLE EUSER89|HLE EUSER172|HLE ESTLIB315|HLE ESTLIB316|HLE ESTLIB317|HLE ESTLIB342|HLE EFSRV15|HLE EFSRV18|HLE EFSRV21|HLE EFSRV86|HLE EFSRV106|HLE EFSRV121|HLE EFSRV136|OOB|HALT|UNIMPLEMENTED" .build/live_hal_vfs_trace.log | tail -n 250 || true
          else
            echo "Live trace log was not created"
          fi
          exit "$rc"
