name: Step144 inspect original N-Gage QD firmware contents

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/step144-inspect-ngage-rom.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install archive tools
        run: sudo apt-get update && sudo apt-get install -y p7zip-full unrar-free unar libarchive-tools
      - name: Download and inspect N-Gage QD firmware archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fL --retry 3 -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/octet-stream" "https://api.github.com/repos/Shakalx3/Shadowkey/releases/assets/727070110" -o /tmp/RH-029.v.04.10.N-GAGE.QD.rar
          echo "8984bd63e50c00b0d70b9f60f4a9b548606dfad0ee957f55082a4a7378bcd640  /tmp/RH-029.v.04.10.N-GAGE.QD.rar" | sha256sum -c -
          echo "=== Archive metadata ==="
          stat -c '%n %s bytes' /tmp/RH-029.v.04.10.N-GAGE.QD.rar
          echo "=== Archive signature ==="
          file /tmp/RH-029.v.04.10.N-GAGE.QD.rar
          xxd -l 64 /tmp/RH-029.v.04.10.N-GAGE.QD.rar
          echo "=== Independent archive listings ==="
          unrar-free -l /tmp/RH-029.v.04.10.N-GAGE.QD.rar || true
          unar -l /tmp/RH-029.v.04.10.N-GAGE.QD.rar || true
          bsdtar -tf /tmp/RH-029.v.04.10.N-GAGE.QD.rar || true
          7z l -slt /tmp/RH-029.v.04.10.N-GAGE.QD.rar || true
          mkdir -p /tmp/ngage-extracted
          echo "=== Extract with unar ==="
          unar -o /tmp/ngage-extracted -f /tmp/RH-029.v.04.10.N-GAGE.QD.rar || true
          echo "=== Extract with bsdtar fallback ==="
          bsdtar -xf /tmp/RH-029.v.04.10.N-GAGE.QD.rar -C /tmp/ngage-extracted || true
          echo "=== Extract with 7z fallback ==="
          7z x /tmp/RH-029.v.04.10.N-GAGE.QD.rar -o/tmp/ngage-extracted -y || true
          echo "=== Extracted file inventory ==="
          find /tmp/ngage-extracted -type f -printf '%p %s bytes\n' | sort | head -n 300
          echo "=== Firmware image signatures and EPOC markers ==="
          find /tmp/ngage-extracted -type f -print0 | while IFS= read -r -d '' f; do
            echo "--- $f ---"
            file "$f"
            xxd -l 128 "$f"
            echo "EPOC marker offsets:"
            grep -abo 'EPOC' "$f" | head -n 30 || true
            echo "Embedded EIKCORE strings:"
            strings -a "$f" | grep -i -m 10 'eikcore' || true
          done
          echo "=== E32 image header scan in MCU image ==="
          python3 - <<'PY'
          from pathlib import Path
          import struct
          p=Path("/tmp/ngage-extracted/RH-029.v.04.10.N-GAGE.QD/RH2941.0C1")
          b=p.read_bytes()
          marker=b"EPOC"
          pos=0
          count=0
          while True:
              pos=b.find(marker,pos)
              if pos<0: break
              h=pos-0x10
              if h>=0 and h+0x40<=len(b):
                  uid1,uid2,uid3=struct.unpack_from("<III",b,h)
                  vals=struct.unpack_from("<8I",b,h+0x10)
                  print(f"EPOC@0x{pos:08x} header@0x{h:08x} UID={uid1:08x}/{uid2:08x}/{uid3:08x} header_words={[hex(x) for x in vals]}")
                  if uid3==0x10004892:
                      print("FOUND EIKCORE candidate; surrounding bytes:",b[h:h+96].hex())
              count+=1
              pos+=4
          print(f"Total EPOC markers: {count}")
          PY
          echo "=== EIKCORE candidates ==="
          find /tmp/ngage-extracted -type f -iname 'eikcore.dll' -o -iname 'eikcore' | while read -r f; do file "$f"; sha256sum "$f"; done
