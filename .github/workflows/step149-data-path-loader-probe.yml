name: Step149 C runtime file-access probe
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/step149-c-runtime-file-probe.yml"
      - "source_bundle/host/step149/**"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-modern:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      e32_tag: ${{ steps.publish.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Download modern EKA2 toolchain
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p downloads modern
          gh release download v0.3.0 --repo hpnkv/symbian-platform --pattern symbian-sdk-0.3.0-linux-x86_64.tar.gz --dir downloads
          tar -xzf downloads/symbian-sdk-0.3.0-linux-x86_64.tar.gz -C modern
          toolchain_file=$(find modern -path '*/cmake/symbian-arm.cmake' -print -quit)
          test -n "$toolchain_file"
          toolchain_file=$(realpath "$toolchain_file")
          modern_root=$(dirname "$(dirname "$toolchain_file")")
          echo "MODERN_ROOT=$modern_root" >> "$GITHUB_ENV"
          echo "TOOLCHAIN_FILE=$toolchain_file" >> "$GITHUB_ENV"
      - name: Build C runtime file-access probe
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ninja-build
          cmake -S source_bundle/host/step149 -B build/step149 -G Ninja -DCMAKE_TOOLCHAIN_FILE="$TOOLCHAIN_FILE" -DSYMBIAN_SDK_PREFIX="$MODERN_ROOT" -DSYMBIAN_TARGET_ARCH=armv5t -DSYMBIAN_RUNTIME_LEGACY_EKA2=ON -DCMAKE_BUILD_TYPE=Release
          cmake --build build/step149 --target ShadowkeyDataPathProbe_e32 --parallel 2
          exe=$(find build/step149 -type f -name ShadowkeyDataPathProbe.exe -print -quit)
          test -s "$exe"
          mkdir -p stage
          cp "$exe" stage/ShadowkeyDataPathProbe.exe
          head -c 1 /dev/zero > stage/ShadowkeyLegacyProbe.dll
      - name: Publish E32 image
        id: publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="shadowkey-step149-e32-$GITHUB_RUN_ID"
          gh release create "$tag" stage/ShadowkeyDataPathProbe.exe stage/ShadowkeyLegacyProbe.dll --repo "$GITHUB_REPOSITORY" --title "Shadowkey Step149 loader probe E32" --notes "Uses Uses fopen to confirm the data path, then RLibrary::Load to test loader acceptance."
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
  package-sis:
    runs-on: windows-latest
    needs: build-modern
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Download E32 images and S60 SIS tools
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          E32_TAG: ${{ needs.build-modern.outputs.e32_tag }}
        run: |
          New-Item -ItemType Directory -Force stage,sdk | Out-Null
          gh release download $env:E32_TAG --repo $env:GITHUB_REPOSITORY --pattern ShadowkeyDataPathProbe.exe --pattern ShadowkeyLegacyProbe.dll --dir stage
          gh release download s60-sdk-3.1-fp1-20261108 --repo $env:GITHUB_REPOSITORY --pattern s60-sdk-devkit-core.tar.gz --dir sdk
          tar -xzf sdk/s60-sdk-devkit-core.tar.gz -C sdk
          $sdkRoot = Join-Path (Get-Location) "sdk"
          $makesis = Get-ChildItem $sdkRoot -Recurse -File -Filter makesis.exe | Select-Object -First 1
          $epocrc = Get-ChildItem $sdkRoot -Recurse -File -Filter epocrc.bat | Select-Object -First 1
          $epocrcScript = Get-ChildItem $sdkRoot -Recurse -File -Filter epocrc.pl | Select-Object -First 1
          if (!$makesis -or !$epocrc -or !$epocrcScript) { throw "Required S60 SDK tools missing" }
          "MAKESIS=$($makesis.FullName)" >> $env:GITHUB_ENV
          "EPOCRC=$($epocrc.FullName)" >> $env:GITHUB_ENV
          "EPOCRC_DIR=$($epocrcScript.DirectoryName)" >> $env:GITHUB_ENV
          "EPOCROOT=$($sdkRoot.TrimEnd('\\') + '\\')" >> $env:GITHUB_ENV
      - name: Compile registration resource
        shell: pwsh
        run: |
          $out = Join-Path (Get-Location) "stage"
          $rss = Join-Path (Get-Location) "source_bundle/host/step149/ShadowkeyDataPathProbe_reg.rss"
          $include = Join-Path (Get-Location) "sdk/Epoc32/include"
          $env:PATH = "$env:EPOCRC_DIR;$env:PATH"
          Push-Location $out
          try {
            & $env:EPOCRC -v -u "-I$include" "-t$out" $rss "-oShadowkeyDataPathProbe_reg.rsc" "-hShadowkeyDataPathProbe_reg.rsg" 2>&1 | Tee-Object -FilePath epocrc.log
            if ($LASTEXITCODE -ne 0) { throw "epocrc failed with exit code $LASTEXITCODE" }
          } finally { Pop-Location }
          if (!(Test-Path stage/ShadowkeyDataPathProbe_reg.rsc)) { throw "Registration RSC missing" }
      - name: Create SIS for C runtime file-access probe
        shell: pwsh
        run: |
          @(
            '#{"Shadowkey Data Path Probe"},(0xE000BF04),1,0,0,TYPE=SA'
            '[0x102032BE], 0, 0, 0, {"S60 3rd Edition FP1"}'
            '%{"OpenAI"}'
            ':"OpenAI"'
            '"stage/ShadowkeyDataPathProbe.exe" - "!:\sys\bin\ShadowkeyDataPathProbe.exe"'
            '"stage/ShadowkeyLegacyProbe.dll" - "!:\data\ShadowkeyLegacyProbe.dll"'
            '"stage/ShadowkeyDataPathProbe_reg.rsc" - "!:\private\10003a3f\import\apps\ShadowkeyDataPathProbe_reg.rsc"'
          ) | Set-Content stage/ShadowkeyDataPathProbe.pkg -Encoding ascii
          & $env:MAKESIS -v stage/ShadowkeyDataPathProbe.pkg stage/ShadowkeyDataPathProbe_Step149.sis
          if ($LASTEXITCODE -ne 0) { throw "makesis failed" }
          $hash = (Get-FileHash stage/ShadowkeyDataPathProbe_Step149.sis -Algorithm SHA256).Hash
          "SIS SHA256: $hash"
          "SIS size: $((Get-Item stage/ShadowkeyDataPathProbe_Step149.sis).Length)"
      - name: Publish SIS package
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "shadowkey-step149-sis-$env:GITHUB_RUN_ID"
          $hash = (Get-FileHash stage/ShadowkeyDataPathProbe_Step149.sis -Algorithm SHA256).Hash
          gh release create $tag stage/ShadowkeyDataPathProbe_Step149.sis --repo $env:GITHUB_REPOSITORY --title "Shadowkey Step149 data-path loader probe" --notes "Tests fopen visibility followed by RLibrary::Load on an inert one-byte data-file payload. SHA256: $hash"
          if ($LASTEXITCODE -ne 0) { throw "GitHub release publication failed" }

# Step149 rebuild after adding the Symbian::FileServer EFSRV import proxy.
