name: Step160 EFSRV runtime load isolation probe
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/step160-efsrv-runtime-helper.yml"
      - "source_bundle/host/step160/**"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-modern:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      e32_tag: ${{ steps.publish.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Download modern EKA2 toolchain
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p downloads modern
          gh release download v0.3.0 --repo hpnkv/symbian-platform --pattern symbian-sdk-0.3.0-linux-x86_64.tar.gz --dir downloads
          tar -xzf downloads/symbian-sdk-0.3.0-linux-x86_64.tar.gz -C modern
          toolchain_file=$(find modern -path '*/cmake/symbian-arm.cmake' -print -quit)
          test -n "$toolchain_file"
          toolchain_file=$(realpath "$toolchain_file")
          modern_root=$(dirname "$(dirname "$toolchain_file")")
          echo "MODERN_ROOT=$modern_root" >> "$GITHUB_ENV"
          echo "TOOLCHAIN_FILE=$toolchain_file" >> "$GITHUB_ENV"
      - name: Build EXE and EFSRV-linked helper DLL
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ninja-build
          cmake -S source_bundle/host/step160 -B build/step160 -G Ninja -DCMAKE_TOOLCHAIN_FILE="$TOOLCHAIN_FILE" -DSYMBIAN_SDK_PREFIX="$MODERN_ROOT" -DSYMBIAN_TARGET_ARCH=armv5t -DSYMBIAN_RUNTIME_LEGACY_EKA2=ON -DCMAKE_BUILD_TYPE=Release
          cmake --build build/step160 --target ShadowkeyFileServerRuntimeHelper160_e32 --parallel 2
          cmake -S source_bundle/host/step160/helper -B build/step160-dll -G Ninja -DCMAKE_TOOLCHAIN_FILE="$TOOLCHAIN_FILE" -DSYMBIAN_SDK_PREFIX="$MODERN_ROOT" -DSYMBIAN_TARGET_ARCH=armv5t -DCMAKE_BUILD_TYPE=Release
          cmake --build build/step160-dll --target ShadowkeyFileServerHelper160 --parallel 2
          exe=$(find build/step160 -type f -name ShadowkeyFileServerRuntimeHelper160.exe -print -quit)
          dll=$(find build/step160-dll -type f -name ShadowkeyFileServerHelper160.dll -print -quit)
          test -s "$exe" && test -s "$dll"
          mkdir -p stage
          cp "$exe" stage/ShadowkeyFileServerRuntimeHelper160.exe
          cp "$dll" stage/ShadowkeyFileServerHelper160.dll
          python3 - <<'PY'
          import struct
          from pathlib import Path
          p=Path("stage/ShadowkeyFileServerHelper160.dll")
          d=p.read_bytes()
          if len(d)<0x7c or d[0x10:0x14]!=b"EPOC": raise SystemExit("Not an E32 image")
          u=lambda o:struct.unpack_from("<I",d,o)[0]
          h={"size":len(d),"uid1":u(0),"uid2":u(4),"uid3":u(8),"dll_ref_count":u(0x54),"export_count":u(0x5c)}
          print(h)
          assert h["uid1"]==0x10000079 and h["uid2"]==0x1000008D and h["uid3"]==0xE000BF59 and h["export_count"]>=1
          PY
      - name: Publish E32 images
        id: publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="shadowkey-step160-e32-$GITHUB_RUN_ID"
          gh release create "$tag" stage/ShadowkeyFileServerRuntimeHelper160.exe stage/ShadowkeyFileServerHelper160.dll --repo "$GITHUB_REPOSITORY" --title "Shadowkey Step160 E32 images" --notes "The EXE has no EFSRV import. It runtime-loads a helper DLL that imports EFSRV and calls RFs::Connect, RFs::Entry, and RFile::Open. If RFs::Connect fails, the helper returns the signed Symbian error code; the EXE displays its absolute value in the yellow matrix."
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
  package-sis:
    runs-on: windows-latest
    needs: build-modern
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Download E32 images and S60 SIS tools
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          E32_TAG: ${{ needs.build-modern.outputs.e32_tag }}
        run: |
          New-Item -ItemType Directory -Force stage,sdk | Out-Null
          gh release download $env:E32_TAG --repo $env:GITHUB_REPOSITORY --pattern ShadowkeyFileServerRuntimeHelper160.exe --pattern ShadowkeyFileServerHelper160.dll --dir stage
          gh release download s60-sdk-3.1-fp1-20261108 --repo $env:GITHUB_REPOSITORY --pattern s60-sdk-devkit-core.tar.gz --dir sdk
          tar -xzf sdk/s60-sdk-devkit-core.tar.gz -C sdk
          $sdkRoot = Join-Path (Get-Location) "sdk"
          $makesis = Get-ChildItem $sdkRoot -Recurse -File -Filter makesis.exe | Select-Object -First 1
          $epocrc = Get-ChildItem $sdkRoot -Recurse -File -Filter epocrc.bat | Select-Object -First 1
          $epocrcScript = Get-ChildItem $sdkRoot -Recurse -File -Filter epocrc.pl | Select-Object -First 1
          if (!$makesis -or !$epocrc -or !$epocrcScript) { throw "Required S60 SDK tools missing" }
          "MAKESIS=$($makesis.FullName)" >> $env:GITHUB_ENV
          "EPOCRC=$($epocrc.FullName)" >> $env:GITHUB_ENV
          "EPOCRC_DIR=$($epocrcScript.DirectoryName)" >> $env:GITHUB_ENV
          "EPOCROOT=$($sdkRoot.TrimEnd('\\') + '\\')" >> $env:GITHUB_ENV
      - name: Compile registration resource
        shell: pwsh
        run: |
          $out = Join-Path (Get-Location) "stage"
          $rss = Join-Path (Get-Location) "source_bundle/host/step160/ShadowkeyFileServerRuntimeHelper160_reg.rss"
          $include = Join-Path (Get-Location) "sdk/Epoc32/include"
          $env:PATH = "$env:EPOCRC_DIR;$env:PATH"
          Push-Location $out
          try {
            & $env:EPOCRC -v -u "-I$include" "-t$out" $rss "-oShadowkeyFileServerRuntimeHelper160_reg.rsc" "-hShadowkeyFileServerRuntimeHelper160_reg.rsg" 2>&1 | Tee-Object -FilePath epocrc.log
            if ($LASTEXITCODE -ne 0) { throw "epocrc failed with exit code $LASTEXITCODE" }
          } finally { Pop-Location }
          if (!(Test-Path stage/ShadowkeyFileServerRuntimeHelper160_reg.rsc)) { throw "Registration RSC missing" }
      - name: Create SIS
        shell: pwsh
        run: |
          @(
            '#{"Shadowkey EFSRV Load Probe"},(0xE000BF5A),1,0,0,TYPE=SA'
            '[0x102032BE], 0, 0, 0, {"S60 3rd Edition FP1"}'
            '%{"OpenAI"}'
            ':"OpenAI"'
            '"stage/ShadowkeyFileServerRuntimeHelper160.exe" - "!:\sys\bin\ShadowkeyFileServerRuntimeHelper160.exe"'
            '"stage/ShadowkeyFileServerHelper160.dll" - "!:\sys\bin\ShadowkeyFileServerHelper160.dll"'
            '"stage/ShadowkeyFileServerRuntimeHelper160_reg.rsc" - "!:\private\10003a3f\import\apps\ShadowkeyFileServerRuntimeHelper160_reg.rsc"'
          ) | Set-Content stage/ShadowkeyFileServerRuntimeHelper160.pkg -Encoding ascii
          & $env:MAKESIS -v stage/ShadowkeyFileServerRuntimeHelper160.pkg stage/ShadowkeyFileServerRuntimeHelper160_Step160.sis
          if ($LASTEXITCODE -ne 0) { throw "makesis failed" }
          $hash = (Get-FileHash stage/ShadowkeyFileServerRuntimeHelper160_Step160.sis -Algorithm SHA256).Hash
          "SIS SHA256: $hash"
          "SIS size: $((Get-Item stage/ShadowkeyFileServerRuntimeHelper160_Step160.sis).Length)"
      - name: Publish SIS package
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "shadowkey-step160-sis-$env:GITHUB_RUN_ID"
          $hash = (Get-FileHash stage/ShadowkeyFileServerRuntimeHelper160_Step160.sis -Algorithm SHA256).Hash
          gh release create $tag stage/ShadowkeyFileServerRuntimeHelper160_Step160.sis --repo $env:GITHUB_REPOSITORY --title "Shadowkey Step160 EFSRV runtime load probe" --notes "SIS tests C fopen, runtime loading of a helper DLL with a static EFSRV import, and reports the exact RFs::Connect error code in the yellow matrix. SHA256: $hash"
          if ($LASTEXITCODE -ne 0) { throw "GitHub release publication failed" }
