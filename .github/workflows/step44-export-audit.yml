name: Symbian 6.1 export ordinal audit
on:
  push:
    branches: [main]
    paths:
      - ".github/step44-export-audit.trigger"
  workflow_dispatch:
concurrency:
  group: shadowkey-step44-export-audit
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch original N-Gage SDK DLLs
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          src=Path("source_bundle/shadowkey_step35_work/shadowkey_import_dispatch.c").read_text()
          dlls=sorted(set(x.lower() for x in re.findall(r'"([A-Z0-9]+)\\[',src)))
          base="6.1/Series60/Epoc32/Release/"
          paths=[base+"wins/udeb/"+d+".lib" for d in dlls]
          paths += [base+"wins/urel/"+d+".dll" for d in ("efsrv","euser","cone","gdi")]
          paths += [base+"armi/urel/"+d+".lib" for d in ("efsrv","euser","cone","gdi")]
          Path("/tmp/sdk_sparse_paths").write_text("\\n".join(paths)+"\\n")
          print("\\n".join(paths))
          PY
          git clone --depth 1 --filter=blob:none --sparse https://github.com/ngagesdk/sdk.git /tmp/ngagesdk-sdk
          cd /tmp/ngagesdk-sdk
          xargs git sparse-checkout set < /tmp/sdk_sparse_paths
      - name: Parse original Symbian 6.1 exports
        run: python3 tools/step44_symbian61_export_audit.py /tmp/ngagesdk-sdk/6.1/Series60/Epoc32/Release/wins/urel
      - name: Commit ordinal map
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            python3 tools/step44_symbian61_export_audit.py /tmp/ngagesdk-sdk/6.1/Series60/Epoc32/Release/wins/urel > /tmp/step44_report.log
            git add docs/STEP44_SYMBIAN61_EXPORT_ORDINAL_AUDIT.md
            git commit -m "Resolve original Symbian 6.1 export ordinals"
            if git push origin HEAD:main; then
              cat /tmp/step44_report.log
              exit 0
            fi
            sleep 2
          done
          exit 1
