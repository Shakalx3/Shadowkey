name: Step 45 — SDK-mapped HLE validation
on:
  push:
    branches: [main]
    paths:
      - "source_bundle/shadowkey_step35_work/shadowkey_hle_vfs_trace.c"
      - "source_bundle/shadowkey_step35_work/shadowkey_hle_bootstrap_v2.c"
      - "source_bundle/shadowkey_step35_work/shadowkey_symbian61_hle.h"
      - "source_bundle/shadowkey_step35_work/shadowkey_hle_bootstrap_v2.c"
      - "source_bundle/shadowkey_step35_work/shadowkey_symbian61_hle.h"
      - "source_bundle/shadowkey_step35_work/shadowkey_step45_sdk_identity_test.c"
      - "source_bundle/shadowkey_step35_work/shadowkey_efsrv_size_test.c"
      - "source_bundle/shadowkey_step35_work/shadowkey_step30_point_import_test.c"
      - "source_bundle/shadowkey_step35_work/shadowkey_step50_arm_import_test.c"
      - "source_bundle/shadowkey_step35_work/shadowkey_step50_arm_import_test.sh"
      - ".github/workflows/step45-validation.yml"
      - "source_bundle/shadowkey_step35_work/build_and_test.sh"
      - "tools/step50_callsite_context.py"
      - ".github/step45-validation.trigger"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: shadowkey-step45-validation
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Extract ARM callsite context
        run: python tools/step50_callsite_context.py
      - name: Run host regression suite
        shell: bash
        run: |
          set -euo pipefail
          cd source_bundle/shadowkey_step35_work
          bash build_and_test.sh > /tmp/step45_build.log 2>&1 || { tail -n 120 /tmp/step45_build.log; exit 1; }
          tail -n 50 /tmp/step45_build.log
      - name: Run live VFS trace with exact ordinal handlers and fail-closed imports
        shell: bash
        run: |
          set -u
          cd source_bundle/shadowkey_step35_work
          set +e
          SHADOWKEY_HLE_FREE_RAM_BYTES=33554432 bash trace_asset_loader_live_vfs.sh > /tmp/step45_trace_runner.log 2>&1
          rc=$?
          set -e
          echo "$rc" > /tmp/step45_trace_exit_code.txt
          echo "trace exit code: $rc"
          if [ -f .build/live_hal_vfs_trace.log ]; then
            grep -E "HLE SDK EFSRV|HALT SDK EFSRV|HLE ESTLIB|HALT ESTLIB|HALT UNIMPLEMENTED|HLE ARM EUSER|HLE ARM CONE|HLE ARM GDI|HLE ARM EIKCORE|IMGDEC|resource index|DrawText|DiscardFont|UNIMPLEMENTED" .build/live_hal_vfs_trace.log | tail -n 160 > /tmp/step45_trace_excerpt.log || true
          else
            echo "live trace log not produced" > /tmp/step45_trace_excerpt.log
          fi
      - name: Write correction and validation report
        shell: bash
        run: |
          {
            echo "# Step 45 — SDK-mapped import correction and validation"
            echo
            echo "## Ground truth"
            echo
            echo "- Step46 recovered the original game's ARM UREL archive-index symbols; WINS UDEB ordinal names are a separate configuration."
            echo "- EUSER3 is CBase::newL; EUSER1582 is CBase::operator new; EUSER858/828 are CleanupStack PushL/Pop; EUSER1407 is TPtrC16; EUSER1575 is TInt64 inequality."
            echo "- EUSER1373/530/711 are TRect constructor/Height/Move; CONE160 is CCoeControl::Rect."
            echo "- GDI151 constructs a 64-byte TFontSpec; GDI108 and GDI101 set TFontStyle stroke weight and posture."
            echo "- EIKCORE222/219 constructors have bounded field-layout HLEs; EIKCORE224 CEikAppUi remains unresolved because a secondary vtable slot is not grounded."\n            echo "- Corrected ARM-identity HLE handlers are active in the host diagnostic harness; N95 OS 9.2 ROM exports remain unverified."
            echo "## Host regression suite"
            echo
            echo "BEGIN HOST LOG"
            tail -n 50 /tmp/step45_build.log
            echo "END HOST LOG"
            echo
            echo "## Live trace runner"
            echo
            cat /tmp/step45_trace_runner.log
            echo
            echo "Live trace exit code: $(cat /tmp/step45_trace_exit_code.txt). Exit 95 is the intentional fail-closed stop at the first unresolved import."
            echo
            echo "## Selected trace evidence"
            echo
            cat /tmp/step45_trace_excerpt.log
            echo
            echo "## ARM callsite context"
            echo
            cat docs/STEP50_EIKCORE_CALLSITE_CONTEXT.md
            echo
            echo "## Interpretation limits"
            echo
            echo "- The live VFS trace stops at the first unresolved import; no full startup or asset-load success is claimed."
            echo "- ARM UREL identities are for the original N-Gage SDK. The N95 RM-320 / Symbian OS 9.2 ROM export table remains a separate compatibility check."
            echo "- No physical Nokia N95 launch is claimed."
          } > docs/STEP45_SDK_MAPPED_HLE_VALIDATION.md
          cat docs/STEP45_SDK_MAPPED_HLE_VALIDATION.md
      - name: Commit report without branch-race conflicts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            {
              echo "# Step 45 — SDK-mapped import correction and validation"
              echo
              echo "- Step46 recovered the original game's ARM UREL archive-index identities; WINS UDEB names are reference data only."
              echo "- EUSER3=CBase::newL; EUSER1582=CBase::operator new; EUSER858/828=CleanupStack PushL/Pop; EUSER1407=TPtrC16; EUSER1575=TInt64 inequality."
              echo "- EUSER1373/530/711=TRect constructor/Height/Move; CONE160=CCoeControl::Rect."
              echo "- GDI151=TFontSpec constructor; GDI108/101=TFontStyle stroke-weight/posture setters."
              echo "- EIKCORE222/219 constructor field-layout HLEs are tested; EIKCORE224 remains fail-closed pending secondary-vtable evidence."\n              echo "- Corrected HLE routes are exercised by the passing host regression suite; target N95 ROM exports are not yet cross-checked."
              echo
              echo "## Host regression suite"
              echo
              echo "BEGIN HOST LOG"
              tail -n 50 /tmp/step45_build.log
              echo "END HOST LOG"
              echo
              echo "## Live trace runner"
              echo
              cat /tmp/step45_trace_runner.log
              echo
              echo "Live trace exit code: $(cat /tmp/step45_trace_exit_code.txt). Exit 95 is an intentional fail-closed stop."
              echo
              echo "## Selected trace evidence"
              echo
              cat /tmp/step45_trace_excerpt.log
              echo
              echo "## ARM callsite context"
              echo
              cat docs/STEP50_EIKCORE_CALLSITE_CONTEXT.md
              echo
              echo "## Interpretation limits"
              echo
              echo "- The live trace stops at the first unresolved import; no full startup or asset-load success is claimed."
              echo "- The original N-Gage SDK ARM UREL map is not the N95 RM-320 / Symbian OS 9.2 ROM export table."
              echo "- No physical Nokia N95 launch is claimed."
            } > docs/STEP45_SDK_MAPPED_HLE_VALIDATION.md
            git add docs/STEP45_SDK_MAPPED_HLE_VALIDATION.md docs/STEP50_EIKCORE_CALLSITE_CONTEXT.md
            if git diff --cached --quiet; then
              echo "Step45 report is unchanged; nothing to commit."
              exit 0
            fi
            git commit -m "Record SDK-mapped HLE validation"
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          exit 1
